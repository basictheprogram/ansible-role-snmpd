---
# tasks file for snmpd

- name: Preflight checks
  ansible.builtin.import_tasks: preflight.yml

- name: Install snmpd
  ansible.builtin.package:
    name: "{{ snmpd_packages }}"
    state: present
  register: snmpd_install_result
  until: snmpd_install_result is succeeded
  retries: 3
  delay: 5

- name: Configure snmpd
  ansible.builtin.template:
    src: snmpd.conf.j2
    dest: /etc/snmp/snmpd.conf
    mode: "0600"
    owner: root
    group: root
  notify:
    - Restart snmpd

- name: Start and enable snmpd
  ansible.builtin.service:
    name: "{{ snmpd_service }}"
    state: started
    enabled: true
