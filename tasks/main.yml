---
# tasks file for snmpd

- name: Preflight checks
  ansible.builtin.import_tasks: preflight.yml

- name: Install snmpd
  ansible.builtin.package:
    name: "{{ snmpd_packages }}"
    state: present
  register: snmpd_install_result
  until: snmpd_install_result is succeeded
  retries: 3
  delay: 5

- name: Create snmpd conf.d directory
  ansible.builtin.file:
    path: "{{ snmpd_conf_d_path }}"
    state: directory
    mode: "0750"
    owner: root
    group: root
  when: snmpd_use_conf_d

- name: Configure snmpd main conf (includeDir stub)
  ansible.builtin.template:
    src: snmpd_main.conf.j2
    dest: /etc/snmp/snmpd.conf
    mode: "0600"
    owner: root
    group: root
  notify:
    - Restart snmpd
  when: snmpd_use_conf_d

- name: Configure snmpd
  ansible.builtin.template:
    src: snmpd.conf.j2
    dest: "{{ snmpd_conf_dest }}"
    mode: "0600"
    owner: root
    group: root
  notify:
    - Restart snmpd

- name: Start and enable snmpd
  ansible.builtin.service:
    name: "{{ snmpd_service }}"
    state: started
    enabled: true
