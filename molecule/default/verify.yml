---
# verify.yml — pre-test preparation for the testinfra suite.
#
# The testinfra tests in tests/test_default.py run snmpwalk to verify
# end-to-end SNMP reachability. This play installs the snmpwalk client
# transiently so those tests can execute. Assertions about daemon state,
# config permissions, and rendered content are owned by testinfra.

- name: Prepare for testinfra verification
  hosts: all
  become: true
  gather_facts: true

  vars:
    _snmpd_snmpwalk_package:
      default:
        - snmp
      Alpine:
        - net-snmp-tools
      RedHat:
        - net-snmp-utils
      Rocky:
        - net-snmp-utils
      Suse:
        - net-snmp
    snmpd_snmpwalk_package: >-
      {{ _snmpd_snmpwalk_package[ansible_facts['os_family']]
         | default(_snmpd_snmpwalk_package['default']) }}

  tasks:
    - name: Install snmpwalk client for testinfra smoke test
      ansible.builtin.package:
        name: "{{ snmpd_snmpwalk_package }}"
        state: present
      register: snmpd_snmpwalk_install
      until: snmpd_snmpwalk_install is succeeded
      retries: 3
      delay: 5
