---
# host_vars for a VM monitored by the data center.
#
# Copy to your inventory at:
#   host_vars/<hostname>.yml       — single host
#   group_vars/<groupname>.yml     — all hosts in a group
#
# Community string security
# -------------------------
# Store community strings in Ansible Vault — never in plain-text inventory.
# Encrypt: ansible-vault encrypt_string 'rtetech' --name 'vault_snmp_rocommunity'
# Then reference as: community: "{{ vault_snmp_rocommunity }}"
#
# Access control — choose ONE of the two approaches below.
# -------------------------------------------------------
# Option A (rocommunity) is what the data center conf uses.  It is simpler
# and grants read-only access to the entire MIB tree.
#
# Option B (com2sec/group/view/access) gives finer-grained OID restriction.
# Use it when you want to limit polling to specific subtrees.

# Write config to /etc/snmp/snmpd.conf.d/ansible-snmpd.conf and replace the
# main snmpd.conf with an includeDir-only stub.
snmpd_use_conf_d: true

# Listen on all IPv4 and IPv6 interfaces.
snmpd_agentaddress: "0.0.0.0,[::]"

# ---------------------------------------------------------------------------
# Option A — rocommunity (simple, full MIB tree, matches data center conf)
# ---------------------------------------------------------------------------
snmpd_security_names: []
snmpd_groups: []
snmpd_views: []
snmpd_accesses: []

snmpd_rocommunities:
  - community: "{{ vault_snmp_rocommunity }}"
    source: 192.168.100.0/24   # restrict to NMS subnet

# ---------------------------------------------------------------------------
# Option B — com2sec/group/view/access (fine-grained OID restriction)
# ---------------------------------------------------------------------------
# snmpd_security_names:
#   - name: ro
#     source: 192.168.100.0/24
#     community: "{{ vault_snmp_rocommunity }}"
#
# snmpd_groups:
#   - name: ro_group
#     security_model: v1
#     security_name: ro
#   - name: ro_group
#     security_model: v2c
#     security_name: ro
#
# snmpd_views:
#   - name: systemonly
#     type: included
#     subtree: ".1.3.6.1.2.1.1"     # SNMPv2-MIB::system
#   - name: systemonly
#     type: included
#     subtree: ".1.3.6.1.2.1.25.1"  # HOST-RESOURCES-MIB::hrSystem
#
# snmpd_accesses:
#   - group: ro_group
#     context: ""
#     security_model: any
#     security_level: noauth
#     prefix: exact
#     read: systemonly
#     write: none
#     notif: none

# ---------------------------------------------------------------------------
# System identity
# ---------------------------------------------------------------------------
snmpd_syslocation: "Unknown Location"
snmpd_syscontact: "techs@real-time.com"
snmpd_dontlogtcpwrappersconnects: "false"

# ---------------------------------------------------------------------------
# Trap destinations — send SNMP traps to the NMS when events occur.
# ---------------------------------------------------------------------------
snmpd_trap_sinks:
  - host: 192.168.100.10
    community: "{{ vault_snmp_rocommunity }}"

# ---------------------------------------------------------------------------
# Monitors
# ---------------------------------------------------------------------------

# Disk space — minimum is free space in KB (kilobytes).
# 10000 KB ≈ 10 MB  |  102400 KB ≈ 100 MB  |  1048576 KB ≈ 1 GB
# Add an entry for every mount point that matters on this VM.
snmpd_disks:
  - path: /
    minimum: 10000   # KB (~10 MB)
  - path: /var
    minimum: 5000    # KB (~5 MB)
  - path: /tmp
    minimum: 1000    # KB (~1 MB)

# Processes — verify critical daemons are running.
# minimum: 1 means at least one instance must be present.
snmpd_processes:
  - name: sshd
    minimum: 1
  - name: rsyslogd
    minimum: 1

# Load average thresholds (1-min, 5-min, 15-min).
snmpd_load:
  one_minute_average: 5
  five_minute_average: 4
  fifteen_minute_average: 3
