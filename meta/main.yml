---
dependencies: []

galaxy_info:
  namespace: realtime
  role_name: snmpd
  author: "Bob Tanner"
  company: "Real Time Enterprises, Inc."
  description: >
    Install and configure the SNMP daemon (snmpd) on Alpine, Debian/Ubuntu,
    Red Hat/Rocky/Alma, Fedora, and SUSE systems. Fork of
    buluma/ansible-role-snmpd (https://github.com/buluma/ansible-role-snmpd),
    modernised for ansible-core 2.20 and ansible-lint 26.x.
  license: Apache-2.0
  min_ansible_version: "2.20"
  platforms:
    - name: Alpine
      versions:
        - all
    - name: EL
      versions:
        - "8"
        - "9"
    - name: Debian
      versions:
        - bookworm
        - trixie
    - name: Fedora
      versions:
        - all
    - name: Ubuntu
      versions:
        - jammy
        - noble
        - resolute
  galaxy_tags:
    - monitoring
    - snmp
    - snmpd
    - network
