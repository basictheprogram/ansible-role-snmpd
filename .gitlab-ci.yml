---
# NOTE: This role is primarily developed and CI-tested on GitHub Actions.
# This GitLab CI configuration is provided for convenience but is not
# actively maintained. The canonical CI pipeline is at:
# https://github.com/basictheprogram/ansible-role-snmpd/actions

image: "python:3.12-slim"

variables:
  PY_COLORS: "1"

before_script:
  - pip install ansible-core molecule molecule-plugins[docker] pytest-testinfra docker

molecule:
  script:
    - molecule test
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
  allow_failure: true
  parallel:
    matrix:
      - image: "ubuntu2404"
        tag: "latest"
      - image: "ubuntu2204"
        tag: "latest"
      - image: "debian12"
        tag: "latest"
      - image: "rockylinux9"
        tag: "latest"
      - image: "fedora40"
        tag: "latest"

galaxy:
  script:
    - ansible-galaxy role import --api-key ${GALAXY_API_KEY} realtime ${CI_PROJECT_NAME}
  rules:
    - if: $CI_COMMIT_TAG != null
