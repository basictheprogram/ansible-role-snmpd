---
# vars file for snmpd

_snmpd_supported_os_families:
  - Alpine
  - Debian
  - RedHat
  - Suse
  - Fedora

_snmpd_packages:
  default:
    - snmpd
  Alpine:
    - net-snmp
  RedHat:
    - net-snmp
  Suse:
    - net-snmp
  Fedora:
    - net-snmp

snmpd_packages: "{{ _snmpd_packages[ansible_facts['os_family']] | default(_snmpd_packages['default']) }}"

snmpd_service: snmpd
