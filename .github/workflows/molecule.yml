---
name: CI

"on":
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "37 19 19 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ansible-lint
        uses: ansible/ansible-lint@v26.4.0

  molecule:
    name: "Molecule / ${{ matrix.distro.label }}"
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distro:
          - label: ubuntu-24.04
            image: ubuntu2404
            tag: latest
          - label: ubuntu-22.04
            image: ubuntu2204
            tag: latest
          - label: debian-12
            image: debian12
            tag: latest
          - label: debian-13
            image: debian13
            tag: latest
          - label: rockylinux-9
            image: rockylinux9
            tag: latest
          - label: fedora-latest
            image: fedora40
            tag: latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ansible-role-snmpd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install \
            ansible-core \
            molecule \
            molecule-plugins[docker] \
            pytest-testinfra \
            docker

      - name: Run Molecule tests
        run: |
          cd ansible-role-snmpd
          molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          ANSIBLE_ROLES_PATH: "${{ github.workspace }}"
          image: ${{ matrix.distro.image }}
          tag: ${{ matrix.distro.tag }}
