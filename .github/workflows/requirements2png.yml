---
# This workflow is not currently active.
# A requirements.dot dependency graph has not been created for this role.
# Enable this workflow and add requirements.dot if you want auto-generated
# dependency graphs committed to a png branch on each release.
name: Dependency Graph (disabled)

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install graphviz
        run: sudo apt-get install -y graphviz

      - name: Generate PNG from dot file
        run: dot -Tpng requirements.dot -o requirements.png

      - name: Commit generated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add requirements.dot requirements.png
          git diff --cached --quiet || git commit -m "chore: update dependency graph"
          git push
